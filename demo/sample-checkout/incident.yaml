version: 1
project: sample-checkout

services:
  - name: checkout-api
    owner: payments-team
    slo:
      error_rate_pct: 1.0
      p99_latency_ms: 800

signals:
  metrics:
    mcp_server: ops-server
    tool: get_metrics
    default_metric: error_rate_pct
  logs:
    mcp_server: ops-server
    tool: get_logs
    query_hint: 'service=checkout-api'
  deploys:
    mcp_server: github
    tool: list_commits
    repo: Piyush-Piyush/warden-sample-checkout
    environment: production
    fallback_mcp_server: ops-server
    fallback_tool: list_deploys

bisect:
  enabled: true
  kit_tool: get_bisect_kit
  candidate_window_minutes: 30

actions:
  safe: [get_logs, get_metrics, list_deploys, get_bisect_kit]
  approval_required: [rollback_deploy, restart_service]

rollback:
  strategy: revert_deploy
  mcp_server: ops-server
  tool: rollback_deploy
  runbook: skills/rollback-procedure/SKILL.md

verification:
  metric: error_rate_pct
  target_below: 1.0
  window_minutes: 5
  poll_interval_seconds: 15

escalation:
  notify: "#payments-oncall"
  human_approver_role: on-call-lead
